<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS - PORTOFOLIO</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    .smooth-scroll {
      scroll-behavior: smooth;
    }

    .project-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .nav-link {
      position: relative;
      transition: color 0.3s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      transition: width 0.3s ease;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    @keyframes slideInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideInBottom {
      from {
        opacity: 0;
        transform: translateY(80px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .fade-in-up {
      animation: fadeInUp 0.6s ease forwards;
    }

    .fade-in-left {
      animation: fadeInLeft 0.8s ease forwards;
    }

    .fade-in-right {
      animation: fadeInRight 0.8s ease forwards;
    }

    .float-animation {
      animation: float 3s ease-in-out infinite;
    }

    .rotate-slow {
      animation: rotate 20s linear infinite;
    }

    .pulse-animation {
      animation: pulse 2s ease-in-out infinite;
    }

    .slide-in-scale {
      animation: slideInScale 0.5s ease forwards;
      opacity: 0;
    }

    .slide-in-bottom {
      animation: slideInBottom 0.8s ease forwards;
      opacity: 0;
    }

    .zoom-in {
      animation: zoomIn 0.6s ease forwards;
      opacity: 0;
    }

    .scroll-animate {
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .scroll-animate.active {
      opacity: 1;
      transform: translateY(0);
    }

    section.revealed {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    .stagger-1 {
      animation-delay: 0.1s;
      opacity: 0;
    }

    .stagger-2 {
      animation-delay: 0.2s;
      opacity: 0;
    }

    .stagger-3 {
      animation-delay: 0.3s;
      opacity: 0;
    }

    .stagger-4 {
      animation-delay: 0.4s;
    }

    .stagger-5 {
      animation-delay: 0.6s;
    }

    .stagger-6 {
      animation-delay: 0.8s;
    }

    .skill-tag {
      transition: all 0.3s ease;
    }

    .skill-tag:hover {
      transform: scale(1.05);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="smooth-scroll">
  <div id="app" style="width: 100%; min-height: 100%;"></div>
  <script>
    const defaultConfig = {
      background_color: "#0f172a",
      surface_color: "#1e293b",
      text_color: "#f8fafc",
      primary_action_color: "#3b82f6",
      secondary_action_color: "#64748b",
      hero_name: "Dede Suryana",
      hero_title: "Full Stack Developer",
      hero_description: "Able to build the entire application, from visual design to behind-the-scenes data management, and ensure that both parts are well integrated",
      about_title: "About Me",
      about_text: "I'm a passionate full-stack developer with over 5 years of experience creating web designs, sales support applications, and user-centric projects. I specialize in mobile apps, web platforms, scalable design systems, and recently, I've also dabbled in IoT.",
      projects_title: "Featured Projects",
      contact_title: "Let's Work Together",
      contact_description: "Have a project you want to work on? Let's get started!",
      footer_text: "© 2025 Dede Suryana. All rights reserved.",
      font_family: "Inter",
      font_size: 16
    };

    let config = {};

    async function onConfigChange(newConfig) {
      config = newConfig;
      
      const customFont = config.font_family || defaultConfig.font_family;
      const baseSize = config.font_size || defaultConfig.font_size;
      const baseFontStack = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryColor = config.secondary_action_color || defaultConfig.secondary_action_color;

      document.body.style.backgroundColor = backgroundColor;
      document.body.style.color = textColor;
      document.body.style.fontFamily = `${customFont}, ${baseFontStack}`;

      // Update navigation
      const nav = document.getElementById('main-nav');
      if (nav) {
        nav.style.backgroundColor = `${backgroundColor}dd`;
      }

      const navLinks = document.querySelectorAll('.nav-link');
      navLinks.forEach(link => {
        link.style.color = textColor;
        link.style.setProperty('--hover-color', primaryColor);
      });

      const navLinkAfters = document.querySelectorAll('.nav-link::after');
      const style = document.createElement('style');
      style.textContent = `.nav-link::after { background-color: ${primaryColor}; }`;
      document.head.appendChild(style);

      // Update hero section
      const heroSection = document.getElementById('hero-section');
      if (heroSection) {
        heroSection.style.backgroundColor = backgroundColor;
      }

      const heroName = document.getElementById('hero-name');
      if (heroName) {
        heroName.textContent = config.hero_name || defaultConfig.hero_name;
        heroName.style.fontSize = `${baseSize * 3}px`;
        heroName.style.color = textColor;
        heroName.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const heroTitle = document.getElementById('hero-title');
      if (heroTitle) {
        heroTitle.textContent = config.hero_title || defaultConfig.hero_title;
        heroTitle.style.fontSize = `${baseSize * 1.5}px`;
        heroTitle.style.color = primaryColor;
        heroTitle.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const heroDesc = document.getElementById('hero-description');
      if (heroDesc) {
        heroDesc.textContent = config.hero_description || defaultConfig.hero_description;
        heroDesc.style.fontSize = `${baseSize * 1.125}px`;
        heroDesc.style.color = secondaryColor;
        heroDesc.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const heroButton = document.getElementById('hero-button');
      if (heroButton) {
        heroButton.style.backgroundColor = primaryColor;
        heroButton.style.color = textColor;
        heroButton.style.fontSize = `${baseSize}px`;
        heroButton.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      // Update about section
      const aboutSection = document.getElementById('about-section');
      if (aboutSection) {
        aboutSection.style.backgroundColor = surfaceColor;
      }

      const aboutTitle = document.getElementById('about-title');
      if (aboutTitle) {
        aboutTitle.textContent = config.about_title || defaultConfig.about_title;
        aboutTitle.style.fontSize = `${baseSize * 2}px`;
        aboutTitle.style.color = textColor;
        aboutTitle.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const aboutText = document.getElementById('about-text');
      if (aboutText) {
        aboutText.textContent = config.about_text || defaultConfig.about_text;
        aboutText.style.fontSize = `${baseSize * 1.125}px`;
        aboutText.style.color = secondaryColor;
        aboutText.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const skillTags = document.querySelectorAll('.skill-tag');
      skillTags.forEach(tag => {
        tag.style.backgroundColor = `${primaryColor}22`;
        tag.style.color = primaryColor;
        tag.style.fontSize = `${baseSize * 0.875}px`;
        tag.style.fontFamily = `${customFont}, ${baseFontStack}`;
      });

      // Update projects section
      const projectsSection = document.getElementById('projects-section');
      if (projectsSection) {
        projectsSection.style.backgroundColor = backgroundColor;
      }

      const projectsTitle = document.getElementById('projects-title');
      if (projectsTitle) {
        projectsTitle.textContent = config.projects_title || defaultConfig.projects_title;
        projectsTitle.style.fontSize = `${baseSize * 2}px`;
        projectsTitle.style.color = textColor;
        projectsTitle.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const projectCards = document.querySelectorAll('.project-card');
      projectCards.forEach(card => {
        card.style.backgroundColor = surfaceColor;
        
        const cardTitle = card.querySelector('.project-title');
        if (cardTitle) {
          cardTitle.style.fontSize = `${baseSize * 1.25}px`;
          cardTitle.style.color = textColor;
          cardTitle.style.fontFamily = `${customFont}, ${baseFontStack}`;
        }

        const cardDesc = card.querySelector('.project-desc');
        if (cardDesc) {
          cardDesc.style.fontSize = `${baseSize}px`;
          cardDesc.style.color = secondaryColor;
          cardDesc.style.fontFamily = `${customFont}, ${baseFontStack}`;
        }

        const cardButton = card.querySelector('.project-button');
        if (cardButton) {
          cardButton.style.color = primaryColor;
          cardButton.style.fontSize = `${baseSize * 0.875}px`;
          cardButton.style.fontFamily = `${customFont}, ${baseFontStack}`;
        }
      });

      // Update contact section
      const contactSection = document.getElementById('contact-section');
      if (contactSection) {
        contactSection.style.backgroundColor = surfaceColor;
      }

      const contactTitle = document.getElementById('contact-title');
      if (contactTitle) {
        contactTitle.textContent = config.contact_title || defaultConfig.contact_title;
        contactTitle.style.fontSize = `${baseSize * 2}px`;
        contactTitle.style.color = textColor;
        contactTitle.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const contactDesc = document.getElementById('contact-description');
      if (contactDesc) {
        contactDesc.textContent = config.contact_description || defaultConfig.contact_description;
        contactDesc.style.fontSize = `${baseSize * 1.125}px`;
        contactDesc.style.color = secondaryColor;
        contactDesc.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const contactButton = document.getElementById('contact-button');
      if (contactButton) {
        contactButton.style.backgroundColor = primaryColor;
        contactButton.style.color = textColor;
        contactButton.style.fontSize = `${baseSize}px`;
        contactButton.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      // Update footer
      const footer = document.getElementById('footer');
      if (footer) {
        footer.style.backgroundColor = backgroundColor;
      }

      const footerText = document.getElementById('footer-text');
      if (footerText) {
        footerText.textContent = config.footer_text || defaultConfig.footer_text;
        footerText.style.fontSize = `${baseSize * 0.875}px`;
        footerText.style.color = secondaryColor;
        footerText.style.fontFamily = `${customFont}, ${baseFontStack}`;
      }

      const socialLinks = document.querySelectorAll('.social-link');
      socialLinks.forEach(link => {
        link.style.color = secondaryColor;
      });
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.surface_color || defaultConfig.surface_color,
            set: (value) => {
              config.surface_color = value;
              window.elementSdk.setConfig({ surface_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.primary_action_color || defaultConfig.primary_action_color,
            set: (value) => {
              config.primary_action_color = value;
              window.elementSdk.setConfig({ primary_action_color: value });
            }
          },
          {
            get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
            set: (value) => {
              config.secondary_action_color = value;
              window.elementSdk.setConfig({ secondary_action_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || defaultConfig.font_size,
          set: (value) => {
            config.font_size = value;
            window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["hero_name", config.hero_name || defaultConfig.hero_name],
        ["hero_title", config.hero_title || defaultConfig.hero_title],
        ["hero_description", config.hero_description || defaultConfig.hero_description],
        ["about_title", config.about_title || defaultConfig.about_title],
        ["about_text", config.about_text || defaultConfig.about_text],
        ["projects_title", config.projects_title || defaultConfig.projects_title],
        ["contact_title", config.contact_title || defaultConfig.contact_title],
        ["contact_description", config.contact_description || defaultConfig.contact_description],
        ["footer_text", config.footer_text || defaultConfig.footer_text]
      ]);
    }

    function initializeApp() {
      const app = document.getElementById('app');
      
      app.innerHTML = `
        <!-- Navigation -->
        <nav id="main-nav" style="position: fixed; top: 0; left: 0; right: 0; z-index: 1000; backdrop-filter: blur(10px);">

            <div style="display: flex; gap: 2rem;">
              <a href="#about" class="nav-link" style="text-decoration: none; font-weight: 500;">About</a>

        <!-- Hero Section -->

          <div class="parallax-slow float-animation" style="position: absolute; top: 8%; left: 8%; pointer-events: none; opacity: 0.3;">
            <svg width="100" height="100" viewBox="0 0 100 100">
              <text x="10" y="50" font-family="monospace" font-size="40" fill="#3b82f6" font-weight="bold">&lt;/&gt;</text>
            </svg>
          </div>
          
          <!-- Curly Braces -->
          <div class="parallax-fast pulse-animation" style="position: absolute; top: 15%; right: 12%; pointer-events: none; opacity: 0.25;">
            <svg width="80" height="80" viewBox="0 0 80 80">
              <text x="5" y="50" font-family="monospace" font-size="50" fill="#3b82f6" font-weight="bold">{ }</text>
            </svg>
          </div>
          
          <!-- Code Brackets -->
          <div class="parallax-slow rotate-slow" style="position: absolute; bottom: 12%; left: 10%; pointer-events: none; opacity: 0.3; animation-duration: 30s;">
            <svg width="90" height="90" viewBox="0 0 90 90">
              <text x="10" y="55" font-family="monospace" font-size="45" fill="#3b82f6" font-weight="bold">[ ]</text>
            </svg>
          </div>
          
          <!-- Function Symbol -->
          <div class="parallax-fast float-animation" style="position: absolute; top: 45%; right: 8%; pointer-events: none; opacity: 0.2; animation-delay: 0.5s;">
            <svg width="70" height="70" viewBox="0 0 70 70">
              <text x="5" y="45" font-family="monospace" font-size="35" fill="#3b82f6" font-weight="bold">fn()</text>

          </div>
          
          <!-- Arrow Function -->
          <div class="parallax-fast float-animation" style="position: absolute; top: 60%; left: 15%; pointer-events: none; opacity: 0.2; animation-delay: 1.5s;">
            <svg width="75" height="75" viewBox="0 0 75 75">
              <text x="5" y="45" font-family="monospace" font-size="35" fill="#3b82f6" font-weight="bold">=&gt;</text>
            </svg>
          </div>
          
          <!-- Code Comment -->
          <div class="parallax-slow" style="position: absolute; top: 30%; left: 5%; pointer-events: none; opacity: 0.15;">
            <svg width="100" height="50" viewBox="0 0 100 50">
              <text x="5" y="30" font-family="monospace" font-size="20" fill="#3b82f6" font-style="italic">//code</text>
            </svg>
          </div>
          
          <!-- Binary Code -->
          <div class="parallax-fast pulse-animation" style="position: absolute; bottom: 35%; right: 5%; pointer-events: none; opacity: 0.2; animation-delay: 0.8s;">
            <svg width="60" height="60" viewBox="0 0 60 60">
              <text x="5" y="25" font-family="monospace" font-size="18" fill="#3b82f6">101</text>
              <text x="5" y="45" font-family="monospace" font-size="18" fill="#3b82f6">010</text>
            </svg>
          </div>
          
          <div style="max-width: 800px; position: relative; z-index: 1;">
            <div class="fade-in-up" style="margin-bottom: 1rem; font-size: 1rem; font-weight: 600; letter-spacing: 0.1em; opacity: 0; animation-delay: 0s;">👋 HELLO, I'M</div>
            <h1 id="hero-name" class="fade-in-up stagger-1" style="margin-bottom: 1rem; font-weight: 800; line-height: 1.1;">Dede Suryana</h1>
            <h2 id="hero-title" class="fade-in-up stagger-2" style="margin-bottom: 1.5rem; font-weight: 600;">Full Stack Developer</h2>
            <p id="hero-description" class="fade-in-up stagger-3" style="margin-bottom: 2.5rem; line-height: 1.6; max-width: 600px; margin-left: auto; margin-right: auto;">Crafting intuitive digital experiences that users love</p>
            <button id="hero-button" class="fade-in-up stagger-3" onclick="document.getElementById('projects').scrollIntoView({behavior: 'smooth'})" style="padding: 1rem 2.5rem; border: none; border-radius: 9999px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);" onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 6px 20px rgba(59, 130, 246, 0.6)'" onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 14px rgba(59, 130, 246, 0.4)'">View My Work</button>
          </div>
        </section>

        <!-- About Section -->
        <section id="about" style="scroll-margin-top: 5rem;">
          <div id="about-section" style="padding: 5rem 2rem;">
            <div style="max-width: 1200px; margin: 0 auto;">
              <h2 id="about-title" class="slide-in-scale about-animate" style="margin-bottom: 3rem; text-align: center; font-weight: 700;">About Me</h2>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem; align-items: center;">
                <div class="fade-in-left about-animate">
                  <p id="about-text" style="margin-bottom: 2rem; line-height: 1.8;">I'm a passionate UI/UX designer with 5+ years of experience creating user-centered designs. I specialize in mobile apps, web platforms, and design systems that scale.</p>
                  <div style="display: flex; flex-wrap: wrap; gap: 0.75rem;">
                    <span class="skill-tag slide-in-scale about-animate stagger-1" style="padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 500;">Figma</span>
                    <span class="skill-tag slide-in-scale about-animate stagger-2" style="padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 500;">Adobe XD</span>
                    <span class="skill-tag slide-in-scale about-animate stagger-3" style="padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 500;">Sketch</span>
                    <span class="skill-tag slide-in-scale about-animate stagger-4" style="padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 500;">Prototyping</span>
                    <span class="skill-tag slide-in-scale about-animate stagger-5" style="padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 500;">User Research</span>
                    <span class="skill-tag slide-in-scale about-animate stagger-6" style="padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 500;">Design Systems</span>
                  </div>
                </div>
                <div class="fade-in-right about-animate" style="display: flex; justify-content: center; flex-wrap: wrap; gap: 1.5rem; align-items: center;">
                  <!-- React Logo -->
                  <div class="float-animation" style="animation-delay: 0s;">
                    <svg width="80" height="80" viewBox="0 0 80 80">
                      <circle cx="40" cy="40" r="8" fill="#61DAFB"/>
                      <ellipse cx="40" cy="40" rx="35" ry="15" fill="none" stroke="#61DAFB" stroke-width="3"/>
                      <ellipse cx="40" cy="40" rx="35" ry="15" fill="none" stroke="#61DAFB" stroke-width="3" transform="rotate(60 40 40)"/>
                      <ellipse cx="40" cy="40" rx="35" ry="15" fill="none" stroke="#61DAFB" stroke-width="3" transform="rotate(120 40 40)"/>
                    </svg>
                    <p style="text-align: center; margin-top: 0.5rem; font-size: 0.75rem; opacity: 0.7; font-family: monospace;">React</p>
                  </div>
                  
                  <!-- Vue Logo -->
                  <div class="float-animation" style="animation-delay: 0.3s;">
                    <svg width="80" height="80" viewBox="0 0 80 80">
                      <path d="M40 15 L20 45 L60 45 Z" fill="#42B883"/>
                      <path d="M40 15 L30 30 L50 30 Z" fill="#35495E"/>
                      <path d="M20 45 L40 65 L60 45 Z" fill="#35495E" opacity="0.3"/>
                    </svg>
                    <p style="text-align: center; margin-top: 0.5rem; font-size: 0.75rem; opacity: 0.7; font-family: monospace;">Vue</p>
                  </div>
                  
                  <!-- AI/Neural Network -->
